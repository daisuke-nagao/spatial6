[package]
name = "spatial6-no-std-consumer"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.89"

[workspace]
resolver = "3"

[features]
default = []
builtin = ["spatial6/builtin"]
nalgebra = ["spatial6/nalgebra"]
glam = ["spatial6/glam"]
serde = ["spatial6/serde", "dep:serde"]

[dependencies.spatial6]
path = "../.."
default-features = false

[dependencies.serde]
version = "1.0"
optional = true
default-features = false

[lib]
path = "src/lib.rs"
