name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.3'
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Pre-commit
        run: uvx pre-commit==4.6.2 run --all-files --show-diff-on-failure
      - name: Check changelog
        run: uvx --with keepachangelog==2.0.0 python -m unittest scripts/test_check_changelog.py
      - name: Clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Test feature configurations
        run: |
          cargo +stable test
          cargo +stable test --no-default-features
          cargo +stable test --no-default-features --features nalgebra
          cargo +stable test --no-default-features --features glam
          cargo +stable test --features serde
          cargo +stable test --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --no-deps --all-features
      - name: Verify package
        run: cargo +stable package

  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test
        run: cargo +stable test --all-targets --all-features

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Test
        run: cargo +1.89.0 test --all-targets --all-features
